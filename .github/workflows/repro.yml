name: repro
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - name: "A: round limit"
        run: dotnet run --no-build -- limit
      - name: "B: unknown next_speaker"
        run: dotnet run --no-build -- speaker
